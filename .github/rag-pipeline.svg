<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">RAG Document Q&amp;A Service architecture</title>
<desc id="d">Ingestion: document, text extraction, chunking, embedding, PostgreSQL with pgvector. Query: question, vector and keyword search in parallel, Reciprocal Rank Fusion, LLM re-ranking, relevance gate, grounded cited answer.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
