<text x="487.0" y="174" text-anchor="middle" font-size="12" fill="#94a3b8">token-aware + overlap</text>
<text x="487.0" y="190" text-anchor="middle" font-size="12" fill="#94a3b8">heading-aware for .md</text>
<rect x="598" y="122" width="150" height="84" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="673.0" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">Embed</text>
<text x="673.0" y="174" text-anchor="middle" font-size="12" fill="#94a3b8">OpenAI · Gemini</text>
<text x="673.0" y="190" text-anchor="middle" font-size="12" fill="#94a3b8">· Ollama</text>
<rect x="784" y="122" width="150" height="84" rx="12" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
