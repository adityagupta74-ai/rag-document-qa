<text x="40" y="76" font-size="14" fill="#94a3b8">FastAPI · PostgreSQL + pgvector · hybrid retrieval · LLM re-ranking · cited answers</text>
<text x="40" y="112" font-size="12" font-weight="700" letter-spacing="2" fill="#38bdf8">INGEST</text>
