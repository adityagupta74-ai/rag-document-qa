<text x="487.0" y="406" text-anchor="middle" font-size="12" fill="#94a3b8">Fusion of both lists</text>
<rect x="598" y="338" width="150" height="84" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
