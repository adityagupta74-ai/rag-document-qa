<text x="301.0" y="174" text-anchor="middle" font-size="12" fill="#94a3b8">pypdf for PDFs</text>
<text x="301.0" y="190" text-anchor="middle" font-size="12" fill="#94a3b8">UTF-8 for text</text>
<rect x="412" y="122" width="150" height="84" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
<text x="487.0" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#e2e8f0">Chunk</text>
